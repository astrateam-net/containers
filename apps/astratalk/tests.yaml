schemaVersion: "2.0.0"

# Structural only — the service needs a licence and Postgres to boot, so we
# verify the key swap landed rather than running the assistant.

commandTests:
  - name: our key present
    command: sh
    args:
      - "-lc"
      - "python -c \"import sys,rasa.utils.licensing as m; sys.exit(0 if '3IqSRU6W9TSirwmOhPwQ' in m.PUBLIC_KEY else 1)\""
    exitCode: 0

  - name: vendor key absent
    command: sh
    args:
      - "-lc"
      - "python -c \"import sys,rasa.utils.licensing as m; sys.exit(0 if '6L90HBMIeiEUkLw85aRx' not in m.PUBLIC_KEY else 1)\""
    exitCode: 0
