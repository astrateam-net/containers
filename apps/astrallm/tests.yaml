schemaVersion: "2.0.0"

fileContentTests:
  - name: our public key installed
    path: /app/.venv/lib/python3.13/site-packages/litellm/proxy/auth/public_key.pem
    expectedContents: ['phfsQShY5V9GqVeqJbsAVyrihu8VUX']
  - name: vendor public key removed
    path: /app/.venv/lib/python3.13/site-packages/litellm/proxy/auth/public_key.pem
    excludedContents: ['A3rF7vrLb8\+1yhF2U62AghQp9nStyu']

fileExistenceTests:
  - name: selftest script not shipped
    path: /tmp/astrallm-selftest.py
    shouldExist: false
  - name: build pubkey copy not shipped
    path: /tmp/astrallm-public.pem
    shouldExist: false

commandTests:
  - name: no licence baked into image
    command: bash
    args:
      - "-lc"
      - "test -z \"${LITELLM_LICENSE:-}\""
    exitCode: 0
