schemaVersion: "2.0.0"

fileContentTests:
  - name: our public key installed
    path: /code/smith-backend/app/license/validation.pyc
    expectedContents: ['doTcanFyuySny6lxjH7E8Pji']
  - name: vendor public key removed
    path: /code/smith-backend/app/license/validation.pyc
    excludedContents: ['oOjipoI0j4LgAVPLfDywwJmL']

fileExistenceTests:
  - name: selftest script not shipped
    path: /tmp/astrascope-selftest.py
    shouldExist: false
  - name: build pubkey copy not shipped
    path: /tmp/astrascope-public.pem
    shouldExist: false

commandTests:
  - name: no licence baked into image
    command: sh
    args:
      - "-c"
      - "test -z \"${LANGSMITH_LICENSE_KEY:-}\""
    exitCode: 0
